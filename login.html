<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 2A Accessories</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
        }

        /* NAVBAR */
        .navbar {
            min-height: 70px;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            padding: 15px 5%;
            gap: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .logo {
            color: white;
            font-size: 23px;
            font-weight: bold;
        }

        .red {
            color: #ff3b3b;
        }

        .menu {
            display: flex;
            list-style: none;
            gap: 25px;
            margin-left: auto;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .menu a:hover {
            color: #00eaff;
        }

        .nav-icons {
            display: flex;
            gap: 20px;
        }

        .nav-icons a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-icons a:hover {
            color: #00eaff;
        }

        /* LOGIN AREA */
        .login-container {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 20px;

            background: rgba(255, 255, 255, 0.95);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.3);

            animation: showBox 0.7s ease;
        }

        @keyframes showBox {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-icon {
            width: 80px;
            height: 80px;
            margin: auto;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 38px;

            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;

            box-shadow: 0 8px 20px rgba(255,65,108,0.4);
        }

        .login-box h1 {
            text-align: center;
            margin-top: 18px;
            color: #222;
            font-size: 30px;
        }

        .welcome {
            text-align: center;
            color: #777;
            margin: 8px 0 30px;
        }

        /* INPUTS */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .input-box {
            position: relative;
        }

        .input-box span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px 13px 45px;

            border: 2px solid #ddd;
            border-radius: 10px;

            outline: none;
            font-size: 15px;

            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #2575fc;
            box-shadow: 0 0 8px rgba(37,117,252,0.25);
        }

        /* FORGOT */
        .forgot {
            text-align: right;
            margin: -5px 0 20px;
        }

        .forgot a {
            color: #2575fc;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot a:hover {
            color: #ff416c;
        }

        /* LOGIN BUTTON */
        .login-btn {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #ff416c,
                #ff4b2b
            );

            color: white;
            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 8px 18px rgba(255,65,108,0.3);

            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255,65,108,0.4);
        }

        /* REGISTER */
        .register {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .register a {
            color: #ff416c;
            text-decoration: none;
            font-weight: bold;
        }

        .register a:hover {
            color: #2575fc;
        }

        /* MOBILE */
        @media (max-width: 700px) {

            .navbar {
                flex-wrap: wrap;
                justify-content: center;
            }

            .logo {
                width: 100%;
                text-align: center;
            }

            .menu {
                margin-left: 0;
                gap: 15px;
            }

            .nav-icons {
                gap: 15px;
            }

            .login-box {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="logo">
            <span class="red">2A</span> Accessories
        </div>

        <ul class="menu">
            <li>
                <a href="index.html">HOME</a>
            </li>

            <li>
                <a href="about.html">ABOUT</a>
            </li>

            <li>
                <a href="contact.html">CONTACT</a>
            </li>
        </ul>

        <div class="nav-icons">
            <a href="login.html">👤 Login</a>
            <a href="cart.html">🛒 Cart</a>
        </div>

    </nav>


    <!-- LOGIN -->
    <div class="login-container">

        <div class="login-box">

            <div class="login-icon">
                👤
            </div>

            <h1>Welcome Back!</h1>

            <p class="welcome">
                Login to your 2A Accessories account
            </p>


            <form onsubmit="loginUser(event)">

                <div class="form-group">

                    <label>Email</label>

                    <div class="input-box">
                        <span>📧</span>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <div class="input-box">
                        <span>🔒</span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                </div>


                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>


                <button class="login-btn" type="submit">
                    LOGIN
                </button>

            </form>


            <div class="register">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </div>

        </div>

    </div>


    <script>
        function loginUser(event) {

            event.preventDefault();

            let email =
                document.getElementById("email").value;

            let password =
                document.getElementById("password").value;

            if (email === "" || password === "") {
                alert("Please fill all fields!");
                return;
            }

            alert("Login Successful!");

            window.location.href = "index.html";
        }
    </script>

</body>
</html>
