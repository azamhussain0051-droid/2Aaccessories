<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - 2A Accessories</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
        }

        /* NAVBAR */
        .navbar {
            min-height: 70px;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            align-items: center;
            padding: 15px 5%;
            gap: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .logo {
            color: white;
            font-size: 23px;
            font-weight: bold;
            white-space: nowrap;
        }

        .red {
            color: #ff3b3b;
        }

        .menu {
            display: flex;
            list-style: none;
            gap: 25px;
            margin-left: auto;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .menu a:hover {
            color: #00eaff;
        }

        .nav-icons {
            display: flex;
            gap: 20px;
        }

        .nav-icons a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-icons a:hover {
            color: #00eaff;
        }

        /* REGISTER AREA */
        .register-container {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 20px;
        }

        .register-box {
            width: 100%;
            max-width: 480px;
            background: rgba(255,255,255,0.96);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: showBox 0.7s ease;
        }

        @keyframes showBox {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .account-icon {
            width: 75px;
            height: 75px;
            margin: auto;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 35px;

            color: white;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);

            box-shadow: 0 8px 20px rgba(255,65,108,0.4);
        }

        .register-box h1 {
            text-align: center;
            margin-top: 15px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin: 8px 0 25px;
        }

        /* INPUT */
        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        .input-box {
            position: relative;
        }

        .input-box span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
        }

        .input-box input {
            width: 100%;
            padding: 12px 12px 12px 43px;
            border: 2px solid #ddd;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #2575fc;
            box-shadow: 0 0 8px rgba(37,117,252,0.2);
        }

        /* PASSWORD MESSAGE */
        .password-message {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }

        /* TERMS */
        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 20px 0;
            font-size: 13px;
            color: #555;
        }

        .terms input {
            margin-top: 3px;
        }

        .terms a {
            color: #2575fc;
            text-decoration: none;
        }

        /* CREATE BUTTON */
        .create-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #ff416c,
                #ff4b2b
            );

            color: white;
            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 8px 18px rgba(255,65,108,0.3);
            transition: 0.3s;
        }

        .create-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255,65,108,0.4);
        }

        /* LOGIN LINK */
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login-link a {
            color: #ff416c;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            color: #2575fc;
        }

        /* MOBILE */
        @media (max-width: 700px) {

            .navbar {
                flex-wrap: wrap;
                justify-content: center;
            }

            .logo {
                width: 100%;
                text-align: center;
            }

            .menu {
                margin-left: 0;
                gap: 15px;
            }

            .nav-icons {
                gap: 15px;
            }

            .register-box {
                padding: 28px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="logo">
            <span class="red">2A</span> Accessories
        </div>

        <ul class="menu">
            <li>
                <a href="index.html">HOME</a>
            </li>

            <li>
                <a href="about.html">ABOUT</a>
            </li>

            <li>
                <a href="contact.html">CONTACT</a>
            </li>
        </ul>

        <div class="nav-icons">
            <a href="login.html">👤 Login</a>
            <a href="cart.html">🛒 Cart</a>
        </div>

    </nav>


    <!-- CREATE ACCOUNT -->
    <div class="register-container">

        <div class="register-box">

            <div class="account-icon">
                👤
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Join 2A Accessories today
            </p>


            <form onsubmit="createAccount(event)">

                <!-- NAME -->
                <div class="form-group">

                    <label>Full Name</label>

                    <div class="input-box">
                        <span>👤</span>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <label>Email</label>

                    <div class="input-box">
                        <span>📧</span>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                </div>


                <!-- PHONE -->
                <div class="form-group">

                    <label>Phone Number</label>

                    <div class="input-box">
                        <span>📱</span>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="03XX XXXXXXX"
                            required
                        >
                    </div>

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label>Password</label>

                    <div class="input-box">
                        <span>🔒</span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >
                    </div>

                    <p class="password-message">
                        Password must be at least 6 characters.
                    </p>

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="form-group">

                    <label>Confirm Password</label>

                    <div class="input-box">
                        <span>🔐</span>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="6"
                            required
                        >
                    </div>

                </div>


                <!-- TERMS -->
                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the
                        <a href="#">Terms & Conditions</a>
                    </label>

                </div>


                <!-- BUTTON -->
                <button
                    type="submit"
                    class="create-btn"
                >
                    CREATE ACCOUNT
                </button>

            </form>


            <!-- LOGIN -->
            <div class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


    <script>

        function createAccount(event) {

            event.preventDefault();

            let name =
                document.getElementById("name").value;

            let email =
                document.getElementById("email").value;

            let phone =
                document.getElementById("phone").value;

            let password =
                document.getElementById("password").value;

            let confirmPassword =
                document.getElementById("confirmPassword").value;


            // PASSWORD CHECK
            if (password !== confirmPassword) {

                alert("Passwords do not match!");

                return;
            }


            // PASSWORD LENGTH
            if (password.length < 6) {

                alert("Password must be at least 6 characters!");

                return;
            }


            // SAVE ACCOUNT TEMPORARILY
            localStorage.setItem(
                "userName",
                name
            );

            localStorage.setItem(
                "userEmail",
                email
            );

            localStorage.setItem(
                "userPhone",
                phone
            );

            localStorage.setItem(
                "userPassword",
                password
            );


            alert(
                "Account created successfully!"
            );


            // LOGIN PAGE
            window.location.href =
                "login.html";
        }

    </script>

</body>
</html>
