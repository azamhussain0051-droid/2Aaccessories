<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - 2A Accessories</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #111, #292929);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contact-box {
            width: 90%;
            max-width: 550px;
            padding: 40px;
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .contact-box h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .contact-box h1 span {
            color: #ff3333;
        }

        .contact-box > p {
            color: #ccc;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .contact-item {
            background: rgba(255,255,255,0.1);
            padding: 18px;
            margin: 15px 0;
            border-radius: 12px;
            transition: 0.3s;
        }

        .contact-item:hover {
            transform: translateY(-5px);
            background: rgba(255,50,50,0.2);
        }

        .contact-item h3 {
            color: #ff3333;
            margin-bottom: 8px;
            font-size: 20px;
        }

        .contact-item p {
            color: white;
            font-size: 17px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background: #ff3333;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: white;
            color: #ff3333;
        }
    </style>
</head>

<body>

    <div class="contact-box">

        <h1>Contact <span>Us</span></h1>

        <p>Feel free to contact us anytime.</p>

        <div class="contact-item">
            <h3>📞 WhatsApp</h3>
            <p>0307-6178402</p>
        </div>

        <div class="contact-item">
            <h3>📱 Phone+WhatsApp</h3>
            <p>0313-1641588</p>
        </div>

        <div class="contact-item">
            <h3>💬 WhatsApp</h3>
            <p>0328-1258745</p>
        </div>

        <a href="index.html" class="back-btn">← Back to Home</a>

    </div>

</body>
</html>
